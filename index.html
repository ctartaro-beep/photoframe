<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Family Photo Frame</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="frame">
    <img id="photo-a" class="photo" draggable="false" />
    <img id="photo-b" class="photo" draggable="false" />
    <div id="overlay">
      <div id="clock"></div>
      <div id="date"></div>
    </div>
    <div id="pause-indicator">Paused — tap and hold to resume</div>
    <div id="status-line"></div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
